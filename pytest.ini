[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    unit: fast, deterministic tests with no network access
    smoke: minimal checks that the framework and local API are healthy
    negative: invalid input and failure-path tests
    integration: tests that exercise an API in-process or over the network
    contract: OpenAPI/schema contract checks
    database: tests that need a PostgreSQL instance (skipped when unconfigured)
    deployment: black-box tests of a deployed API (needs DEPLOYED_API_URL)
    aws: AWS service tests (moto in-process by default; real/LocalStack opt-in)
    warehouse: Snowflake/ClickHouse data validation (skipped when unconfigured)
    ai: AI/ML API schema, latency and quality checks
    external: tests that call a real third-party service (needs internet)
